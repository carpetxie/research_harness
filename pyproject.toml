[project]
name = "research-harness"
version = "0.1.0"
description = "General-purpose quantitative research harness"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
